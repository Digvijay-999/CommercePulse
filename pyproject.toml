[project]
name = "commercepulse"
version = "0.1.0"
description = "Retail event analytics: synthetic e-commerce events -> Parquet -> DuckDB + dbt"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-duckdb==1.11.1",
    "duckdb==1.5.5",
    "numpy>=2.5.5",
    "pyarrow>=26.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["data_pipeline/tests"]
